<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой ритм — Модульные тесты (Test Runner)</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #26354a;
      --border: #334155;
      --border-light: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --pass: #10b981;
      --pass-bg: rgba(16, 185, 129, 0.12);
      --pass-border: rgba(16, 185, 129, 0.3);
      --fail: #ef4444;
      --fail-bg: rgba(239, 68, 68, 0.12);
      --fail-border: rgba(239, 68, 68, 0.3);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.12);
      --primary: #38bdf8;
      --primary-bg: rgba(56, 189, 248, 0.12);
      --primary-hover: #0284c7;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .header-title-box h1 {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title-box h1 .app-badge {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--primary-bg);
      color: var(--primary);
      border: 1px solid var(--primary);
      letter-spacing: 0.5px;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }
    .btn-outline:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }

    /* STATS SUMMARY */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 28px;
      font-weight: 700;
    }

    .stat-val.passed { color: var(--pass); }
    .stat-val.failed { color: var(--fail); }
    .stat-val.rate { color: var(--primary); }

    /* PROGRESS BAR */
    .progress-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #0b1120;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--pass);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .progress-bar-fill.has-errors {
      background: var(--fail);
    }

    /* CONTROLS & FILTER */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      color: var(--text-main);
      border-color: var(--border-light);
    }

    .filter-btn.active {
      background: var(--primary-bg);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .search-input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      width: 240px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    /* SUITES LIST */
    .suites-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .suite-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .suite-card.has-errors {
      border-color: var(--fail-border);
    }

    .suite-header {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
    }

    .suite-header:hover {
      background: var(--bg-card-hover);
    }

    .suite-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .suite-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .badge-success {
      background: var(--pass-bg);
      color: var(--pass);
      border: 1px solid var(--pass-border);
    }

    .badge-error {
      background: var(--fail-bg);
      color: var(--fail);
      border: 1px solid var(--fail-border);
    }

    .tests-list {
      list-style: none;
      padding: 6px 0;
    }

    .test-item {
      display: flex;
      flex-direction: column;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 13.5px;
      transition: background 0.15s ease;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .test-item:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .test-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .test-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-pass {
      background: var(--pass-bg);
      color: var(--pass);
      border: 1px solid var(--pass-border);
    }

    .status-fail {
      background: var(--fail-bg);
      color: var(--fail);
      border: 1px solid var(--fail-border);
    }

    .test-name {
      color: var(--text-main);
      word-break: break-word;
    }

    .test-time {
      font-size: 12px;
      color: var(--text-sub);
      font-family: monospace;
      flex-shrink: 0;
    }

    .error-box {
      margin-top: 8px;
      padding: 10px 14px;
      background: #2d1519;
      border-left: 3px solid var(--fail);
      border-radius: 4px;
      color: #fca5a5;
      font-size: 12px;
      font-family: Consolas, Monaco, monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* EMPTY STATE */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header class="header">
      <div class="header-title-box">
        <h1>
          <span>Мой ритм</span>
          <span class="app-badge">Test Runner</span>
        </h1>
        <p class="header-subtitle">Автономный тестовый стенд для проверки 8 модульных сьютов Vanilla JS</p>
      </div>
      <div class="header-actions">
        <button id="btn-rerun" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Запустить снова
        </button>
        <button id="btn-toggle-all" class="btn btn-outline">Свернуть всё</button>
      </div>
    </header>

    <!-- STATS -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Всего тестов</span>
        <span id="stat-total" class="stat-val">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Пройдено</span>
        <span id="stat-passed" class="stat-val passed">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Ошибок</span>
        <span id="stat-failed" class="stat-val failed">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pass Rate</span>
        <span id="stat-rate" class="stat-val rate">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Время</span>
        <span id="stat-duration" class="stat-val">—</span>
      </div>
    </section>

    <!-- PROGRESS -->
    <section class="progress-wrap">
      <div class="progress-info">
        <span id="progress-status-text">Готов к запуску</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
    </section>

    <!-- FILTERS -->
    <section class="filter-bar">
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">Все (<span id="count-all">0</span>)</button>
        <button class="filter-btn" data-filter="passed">Успешные (<span id="count-passed">0</span>)</button>
        <button class="filter-btn" data-filter="failed">С ошибками (<span id="count-failed">0</span>)</button>
      </div>
      <input type="text" id="search-tests" class="search-input" placeholder="Поиск по названию теста...">
    </section>

    <!-- SUITES ACCORDION CONTAINER -->
    <main id="suites-root" class="suites-container">
      <div class="empty-state">Инициализация и запуск тестов...</div>
    </main>

    <footer class="footer">
      «Мой ритм» • Комплексный регрессионный стенд • Версия приложения: 1.0.0
    </footer>
  </div>

  <!-- SCRIPT BOOTSTRAP -->
  <script type="module">
    import { APP_CONFIG } from '../js/config.js';
    import { StorageService } from '../js/storage.js';
    import { AuthService, generateSimplePassword } from '../js/auth-service.js';
    import { AiService } from '../js/ai-service.js';
    import { ChartManager } from '../js/chart-manager.js';
    import { TestRunner, registerAllTests } from './unit-tests.js';

    // Expose modules for debugging & console inspection
    window.APP_CONFIG = APP_CONFIG;
    window.StorageService = StorageService;
    window.AuthService = AuthService;
    window.generateSimplePassword = generateSimplePassword;
    window.AiService = AiService;
    window.ChartManager = ChartManager;
    window.TestRunner = TestRunner;
    window.registerAllTests = registerAllTests;

    // DOM Elements
    const statTotal = document.getElementById('stat-total');
    const statPassed = document.getElementById('stat-passed');
    const statFailed = document.getElementById('stat-failed');
    const statRate = document.getElementById('stat-rate');
    const statDuration = document.getElementById('stat-duration');
    const progressFill = document.getElementById('progress-fill');
    const progressStatusText = document.getElementById('progress-status-text');
    const progressPercent = document.getElementById('progress-percent');
    const suitesRoot = document.getElementById('suites-root');
    const btnRerun = document.getElementById('btn-rerun');
    const btnToggleAll = document.getElementById('btn-toggle-all');
    const countAll = document.getElementById('count-all');
    const countPassed = document.getElementById('count-passed');
    const countFailed = document.getElementById('count-failed');
    const searchInput = document.getElementById('search-tests');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';
    let searchQuery = '';
    let currentResults = null;
    let areAllExpanded = true;

    // Run tests function
    async function executeTests() {
      console.log('%c[TEST RUNNER] Инициализация прогона тестов...', 'color: #38bdf8; font-weight: bold;');
      suitesRoot.innerHTML = '';
      progressFill.style.width = '0%';
      progressFill.classList.remove('has-errors');
      progressStatusText.textContent = 'Выполнение тестов...';

      const runner = new TestRunner();
      registerAllTests(runner);

      const totalPlanned = runner.suites.reduce((sum, s) => sum + s.tests.length, 0);
      let executedCount = 0;
      const startTime = performance.now();

      const results = await runner.run((test, suiteName) => {
        executedCount++;
        const pct = Math.round((executedCount / totalPlanned) * 100);
        progressFill.style.width = `${pct}%`;
        progressPercent.textContent = `${pct}%`;
        progressStatusText.textContent = `Тест ${executedCount} из ${totalPlanned}: ${test.name}`;

        if (!test.passed) {
          progressFill.classList.add('has-errors');
          console.error(`[FAIL] [${suiteName}] ${test.name}`, test.error);
        } else {
          console.log(`[PASS] [${suiteName}] ${test.name} (${test.duration}ms)`);
        }
      });

      const totalDuration = Math.round(performance.now() - startTime);

      // Expose to window for automated checks
      window.__TEST_RESULTS__ = {
        total: results.total,
        passed: results.passed,
        failed: results.failed,
        duration: totalDuration,
        suites: results.suites,
        errors: results.suites.flatMap(s => s.tests.filter(t => !t.passed).map(t => ({
          suite: s.name,
          test: t.name,
          error: t.error,
          stack: t.stack
        }))),
        timestamp: new Date().toISOString()
      };

      currentResults = window.__TEST_RESULTS__;

      // Update Header Stats
      statTotal.textContent = results.total;
      statPassed.textContent = results.passed;
      statFailed.textContent = results.failed;
      const ratePct = results.total > 0 ? Math.round((results.passed / results.total) * 100) : 0;
      statRate.textContent = `${ratePct}%`;
      statDuration.textContent = `${totalDuration} ms`;

      countAll.textContent = results.total;
      countPassed.textContent = results.passed;
      countFailed.textContent = results.failed;

      progressStatusText.textContent = results.failed === 0
        ? `Все ${results.total} тестов успешно пройдены за ${totalDuration} ms!`
        : `Тесты завершены с ошибками: ${results.failed} из ${results.total}`;

      console.log(
        `%c[TEST RUNNER] ИТОГ: ${results.passed}/${results.total} успешно, ${results.failed} ошибок (${totalDuration} ms)`,
        results.failed === 0 ? 'color: #10b981; font-weight: bold; font-size: 14px;' : 'color: #ef4444; font-weight: bold; font-size: 14px;'
      );

      renderSuites();
    }

    // Render suites according to filter & search
    function renderSuites() {
      if (!currentResults) return;
      suitesRoot.innerHTML = '';

      let matchedTotal = 0;

      currentResults.suites.forEach((suite, sIdx) => {
        const filteredTests = suite.tests.filter(t => {
          if (currentFilter === 'passed' && !t.passed) return false;
          if (currentFilter === 'failed' && t.passed) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return t.name.toLowerCase().includes(q) || suite.name.toLowerCase().includes(q);
          }
          return true;
        });

        if (filteredTests.length === 0) return;
        matchedTotal += filteredTests.length;

        const suitePassed = suite.tests.filter(t => t.passed).length;
        const suiteHasErrors = suitePassed < suite.tests.length;

        const card = document.createElement('div');
        card.className = `suite-card ${suiteHasErrors ? 'has-errors' : ''}`;

        const header = document.createElement('div');
        header.className = 'suite-header';
        header.innerHTML = `
          <div class="suite-title">
            <span class="chevron" style="display:inline-block; transition: transform 0.2s ease;">▼</span>
            <span>${suite.name}</span>
          </div>
          <span class="suite-badge ${suiteHasErrors ? 'badge-error' : 'badge-success'}">
            ${suitePassed}/${suite.tests.length} OK
          </span>
        `;

        const list = document.createElement('ul');
        list.className = 'tests-list';

        filteredTests.forEach(t => {
          const item = document.createElement('li');
          item.className = 'test-item';
          item.innerHTML = `
            <div class="test-row">
              <div class="test-left">
                <span class="status-tag ${t.passed ? 'status-pass' : 'status-fail'}">${t.passed ? 'OK' : 'FAIL'}</span>
                <span class="test-name">${t.name}</span>
              </div>
              <span class="test-time">${t.duration}ms</span>
            </div>
            ${!t.passed ? `<div class="error-box">${escapeHtml(t.error)}\n${escapeHtml(t.stack || '')}</div>` : ''}
          `;
          list.appendChild(item);
        });

        header.addEventListener('click', () => {
          const isHidden = list.style.display === 'none';
          list.style.display = isHidden ? 'block' : 'none';
          header.querySelector('.chevron').style.transform = isHidden ? 'rotate(0deg)' : 'rotate(-90deg)';
        });

        card.appendChild(header);
        card.appendChild(list);
        suitesRoot.appendChild(card);
      });

      if (matchedTotal === 0) {
        suitesRoot.innerHTML = `<div class="empty-state">Нет тестов, соответствующих выбранному фильтру или запросу.</div>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Toggle collapse/expand all
    btnToggleAll.addEventListener('click', () => {
      areAllExpanded = !areAllExpanded;
      btnToggleAll.textContent = areAllExpanded ? 'Свернуть всё' : 'Развернуть всё';
      document.querySelectorAll('.suite-card').forEach(card => {
        const list = card.querySelector('.tests-list');
        const chevron = card.querySelector('.chevron');
        if (list) list.style.display = areAllExpanded ? 'block' : 'none';
        if (chevron) chevron.style.transform = areAllExpanded ? 'rotate(0deg)' : 'rotate(-90deg)';
      });
    });

    // Filter tabs
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderSuites();
      });
    });

    // Search input
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderSuites();
    });

    // Re-run button
    btnRerun.addEventListener('click', () => {
      executeTests();
    });

    // Expose runner globally
    window.runTests = executeTests;

    // Auto-run on load
    executeTests();
  </script>
</body>
</html>
